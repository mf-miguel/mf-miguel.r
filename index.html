<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MF Miguel | Ropa para ti</title>
<style>
:root{--bg:#fbf8f1;--fg:#0d0d0d;--muted:#6e6a5e;--accent:#b8862b;--card:#fff;--line:#e8e0cc;--wa:#25D366}
@media (prefers-color-scheme:dark){:root{--bg:#0d0d0d;--fg:#f5f1e6;--muted:#a8a293;--accent:#d9a84a;--card:#161616;--line:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg)}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);transition:box-shadow .3s}
header.scrolled{box-shadow:0 6px 18px rgba(0,0,0,.08)}
.bar{display:flex;align-items:center;padding:14px 16px;max-width:1100px;margin:auto}
.brand{font-weight:700;font-size:1.2rem;letter-spacing:.5px}.brand span{color:var(--accent)}
.hero{padding:44px 16px 36px;text-align:center;background:linear-gradient(135deg,#0d0d0d,#1c1c1c);color:#f5f1e6;border-bottom:2px solid #d9a84a;animation:fadeUp .8s ease both}
.hero h1{margin:0 0 8px;font-size:clamp(1.6rem,4vw,2.4rem)}
.hero h1::after{content:"";display:block;width:64px;height:3px;background:#d9a84a;margin:14px auto 0;border-radius:2px;transform:scaleX(0);animation:grow .9s .4s ease forwards}
.hero p{margin:0 auto;max-width:560px;opacity:.9;line-height:1.5}
main{max-width:1100px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:16px 0}
.tab{flex:none;border:1px solid var(--line);background:transparent;color:var(--muted);padding:6px 14px;border-radius:999px;cursor:pointer;font-size:.9rem;transition:transform .2s}
.tab:hover{transform:translateY(-1px)}
.tab.active{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.info{font-size:.9rem;color:var(--muted);margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;opacity:0;transform:translateY(18px);animation:fadeUp .6s ease forwards;transition:transform .35s,box-shadow .35s}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 28px rgba(0,0,0,.12)}
.photo{width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--line);display:block;transition:transform .6s}
.card:hover .photo{transform:scale(1.04)}
.body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.name{font-weight:600;font-size:.95rem}.meta{font-size:.8rem;color:var(--muted)}
.price{font-weight:700;color:var(--accent)}
.wa-group{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding-top:6px}
.wa{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--wa);color:#0d0d0d;text-decoration:none;padding:9px 8px;border-radius:10px;font-size:.85rem;font-weight:600;box-shadow:0 4px 10px rgba(37,211,102,.25);transition:transform .2s}
.wa:hover{transform:translateY(-1px)}.wa:active{transform:scale(.97)}
.wa svg{transition:transform .3s}.wa:hover svg{transform:translateX(2px) rotate(-8deg)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}
footer{border-top:1px solid var(--line);margin-top:30px;padding:20px 16px;font-size:.9rem;color:var(--muted);text-align:center;line-height:1.6}
@keyframes fadeUp{to{opacity:1;transform:none}}
@keyframes grow{to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.card{opacity:1;transform:none}}
</style>
</head>
<body>
<header><div class="bar"><div class="brand">MF <span>Miguel</span></div></div></header>
<section class="hero"><h1>Estilo para cada día</h1><p>Polos, camisas y pantalones de calidad para toda la familia, en San Agustín de Cajas.</p></section>
<main>
<nav class="tabs" id="tabs"></nav>
<div class="info" id="count"></div>
<section class="grid" id="grid"></section>
</main>
<footer>
<div><strong>MF Miguel</strong> · Ropa para ti</div>
<div>Jr. Los Cipreses, San Agustín de Cajas, Huancayo</div>
<div>Horario: 8:00 a 21:00</div>
</footer>
<script>
const WA = [{n:"51939530279",label:"Ventas"},{n:"51953519892",label:"Pedidos"}];
const CATS = ["Todos","Polos","Camisas","Pantalones"];
const CART = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>';
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ph = name => "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='300' height='400'><rect width='100%' height='100%' fill='#e8e0cc'/><text x='50%' y='50%' font-family='sans-serif' font-size='18' fill='#6e6a5e' text-anchor='middle'>${esc(name)}</text></svg>`);
let items = [], cat = "Todos";

function renderTabs(){
  document.getElementById("tabs").innerHTML = CATS.map(c => `<button class="tab ${c===cat?"active":""}" data-cat="${c}">${c}</button>`).join("");
}
function renderGrid(){
  const list = items.filter(p => cat === "Todos" || p.cat === cat);
  document.getElementById("count").textContent = `${list.length} prenda(s)`;
  document.getElementById("grid").innerHTML = list.length ? list.map((p, i) => {
    const msg = encodeURIComponent(`Hola, quisiera consultar por: ${p.name} (S/ ${p.price})`);
    const links = WA.map(w => `<a class="wa" href="https://wa.me/${w.n}?text=${msg}" target="_blank" rel="noopener">${CART}${w.label}</a>`).join("");
    return `<article class="card" style="animation-delay:${Math.min(i,12)*70}ms">
      <img class="photo" src="${esc(p.img) || ph(p.name)}" alt="${esc(p.name)}" loading="lazy">
      <div class="body"><div class="name">${esc(p.name)}</div>
      <div class="meta">Tallas: ${esc(p.sizes)}</div>
      <div class="price">S/ ${Number(p.price).toFixed(2)}</div>
      <div class="wa-group">${links}</div></div></article>`;
  }).join("") : `<div class="empty">No hay prendas en esta categoría.</div>`;
}
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-cat]"); if(!b) return;
  cat = b.dataset.cat; renderTabs(); renderGrid();
});
window.addEventListener("scroll", () => document.querySelector("header").classList.toggle("scrolled", scrollY > 10));
fetch("productos.json", {cache: "no-store"}).then(r => r.json()).then(d => { items = d.items || []; renderTabs(); renderGrid(); })
  .catch(() => { document.getElementById("grid").innerHTML = `<div class="empty">No se pudieron cargar los productos.</div>`; });
</script>
</body>
</html>
